version: '3.8'

services:
  verilator-api:
    build:
      context: ./verilator-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./shared:/shared
      - ./results:/app/results
    tmpfs:
      - /tmp
    environment:
      - SERVICE_NAME=verilator-simulation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 300s
      timeout: 20s
      retries: 2
      start_period: 30s

  openlane-api:
    build:
      context: ./openlane-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./shared:/shared
      - ./results:/app/results
    tmpfs:
      - /tmp
    environment:
      - SERVICE_NAME=openlane-implementation
      - PDK_ROOT=/openlane/pdks
      - PDK=sky130A
      - STD_CELL_LIBRARY=sky130_fd_sc_hd
      - PDKPATH=/openlane/pdks/sky130A
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 300s
      timeout: 20s
      retries: 2
      start_period: 30s

  eda-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - verilator-api
      - openlane-api
    volumes:
      - ./results:/app/results
      - ./shared:/shared
    tmpfs:
      - /tmp
    environment:
      - VERILATOR_URL=http://verilator-api:8001
      - OPENLANE_URL=http://openlane-api:8003
